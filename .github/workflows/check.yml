name: Check calendar changes
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: node --test
