name: Check Liechtenstein source access
on:
  push:
    branches: [source-check-liechtenstein]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check each public academy stream page
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {sources,collect,makeFetcher} from './scripts/ingest.mjs';
          const get = makeFetcher();
          const logged = async(url,json) => {
            console.log('Checking',url);
            try {const result = await get(url,json); console.log('OK',url); return result;}
            catch(e) {console.log('FAILED',url,e.message); throw e;}
          };
          const result=await collect(undefined,new Date(),sources.filter(s=>s.id==='liechtenstein'),logged);
          console.log(JSON.stringify({count:result.events.length,sources:result.sources}));
          NODE
